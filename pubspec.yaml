name: flashdrop
description: Ultra-fast offline peer-to-peer file sharing for Android using Flutter, Google Nearby Connections, and Wi-Fi Direct.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  open_filex: ^4.6.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
